services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      APP_ENV: production
      IMAGE_UPLOAD_MODE: temporary
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
